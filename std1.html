<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Dashboard</title>

<style>

body{
    margin:0;
    padding:20px;
    font-family:Arial, sans-serif;
    background:skyblue;
    text-align:center;
}

.card{
    background:white;
    width:320px;
    margin:auto;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}

.bar{
    width:100%;
    height:20px;
    background:#ddd;
    border-radius:10px;
    overflow:hidden;
    margin-top:10px;
}

.fill{
    height:100%;
    width:0%;
    color:white;
    text-align:center;
    line-height:20px;
    border-radius:10px;
    font-size:12px;
}

button{
    padding:10px 20px;
    border:none;
    background:red;
    color:white;
    border-radius:5px;
    cursor:pointer;
    margin-top:15px;
}

button:hover{
    background:darkred;
}

</style>
</head>

<body>

<div class="card">

    <h2>My Attendance</h2>

    <p id="info"></p>
    <p id="total"></p>
    <p id="present"></p>
    <p id="percent"></p>

    <div class="bar">
        <div id="fill" class="fill"></div>
    </div>

    <button onclick="logout()">Logout</button>

</div>

<script>

let user = JSON.parse(localStorage.getItem("currentUser"));

if (!user) {
    alert("Login First ❌");
    window.location.href = "login.html";
}

let students = JSON.parse(localStorage.getItem("students")) || [];

let s = students.find(function(st){
    return (
        st.name === user.name &&
        st.branch === user.branch &&
        st.section === user.section
    );
});

if (!s) {
    alert("Student data not found ❌");
}
else{

    let per = 0;

    if (s.total > 0) {
        per = ((s.present / s.total) * 100).toFixed(1);
    }

    document.getElementById("info").innerText =
        "Name: " + s.name + " (" + s.branch + " - " + s.section + ")";

    document.getElementById("total").innerText =
        "Total Classes: " + s.total;

    document.getElementById("present").innerText =
        "Present Classes: " + s.present;

    document.getElementById("percent").innerText =
        "Attendance: " + per + "%";

    let bar = document.getElementById("fill");

    bar.style.width = per + "%";
    bar.innerText = per + "%";

    if (per >= 75) {
        bar.style.background = "green";
    }
    else {
        bar.style.background = "red";
    }
}

function logout(){
    localStorage.removeItem("currentUser");
    window.location.href = "login.html";
}

</script>

</body>
</html>
